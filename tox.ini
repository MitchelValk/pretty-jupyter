[tox]
envlist = py{38,39,310,311,312,313}-nbconvert{6,7}

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
passenv = *
deps =
    pytest
    selenium>=4.11
    ipykernel
    pandas
    plotly
    itables
    nbconvert6: nbconvert>=6.5,<7
    nbconvert7: nbconvert>=7,<8
commands =
    pytest tests/ {posargs}
