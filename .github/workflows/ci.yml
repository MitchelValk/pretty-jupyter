name: build

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  build:
    # 22.04 still provides Python 3.8 through setup-python
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
        nbconvert: ['6', '7']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Test with tox
      # the runner image ships Chrome; Selenium Manager picks a matching driver
      run: tox -e py$(echo ${{ matrix.python-version }} | tr -d .)-nbconvert${{ matrix.nbconvert }}
